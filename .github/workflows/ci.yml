# CI pipeline for CLX — Rust workspace with 4 crates.
#
# Jobs:
#   check    — Format + lint validation (fast gate, runs on ubuntu only)
#   test     — Run full test suite (matrix: ubuntu + macos)
#   build    — Compile release binaries (matrix: ubuntu + macos)
#   coverage — Measure line coverage with cargo-llvm-cov; fails if < 88%
#              Also verifies no unreviewed insta snapshots are present.
#   audit    — Curated supply-chain gate via cargo-deny (advisories + bans +
#              licenses + sources, governed by deny.toml; ubuntu only)
#
# Caching: Swatinem/rust-cache caches ~/.cargo/registry, ~/.cargo/git,
# and the target directory keyed on Cargo.lock + OS + toolchain.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Ensure incremental compilation is disabled in CI for reproducible builds.
  CARGO_INCREMENTAL: 0
  # Fail on any rustc warning that slips past clippy.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # check: fast validation — fmt + clippy
  # Runs on a single host (ubuntu) because style checks are platform-neutral.
  # ---------------------------------------------------------------------------
  check:
    name: Check (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # keyring's `linux-native-sync-persistent` feature pulls in
      # dbus-secret-service -> libdbus-sys, whose build script hard-fails
      # without the system `dbus-1.pc`. ubuntu-latest ships libssl-dev but not
      # libdbus-1-dev, so every Linux job that compiles the workspace needs
      # this. macOS/Windows use the native Keychain/Credential Manager and
      # never enter this code path.
      - name: Install Linux system dependencies (libdbus for keyring)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust stable (with rustfmt + clippy components)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # -D warnings turns every clippy warning into an error.
      # The workspace Cargo.toml already sets clippy::pedantic + unsafe_code = "deny",
      # so this enforces those rules unconditionally.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # test: run the full test suite on both Linux and macOS
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # See the `check` job: libdbus-sys needs the system dbus dev package.
      # Guarded on Linux - the macOS leg of this matrix must not run apt.
      - name: Install Linux system dependencies (libdbus for keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # --locked fails fast if Cargo.lock is stale (e.g. a dep bump not committed),
      # surfacing lockfile drift in-PR rather than as a later mysterious red.
      - name: Run tests
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # build: compile release binaries to verify the workspace builds cleanly
  # on both target platforms.
  # ---------------------------------------------------------------------------
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # See the `check` job: libdbus-sys needs the system dbus dev package.
      # Guarded on Linux - the macOS leg of this matrix must not run apt.
      - name: Install Linux system dependencies (libdbus for keyring)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace --locked

  # ---------------------------------------------------------------------------
  # coverage: measure line coverage with cargo-llvm-cov on macOS to match
  # the primary dev environment. Fails the build if line coverage drops
  # below 88%. Also verifies that no unreviewed insta snapshots exist.
  #
  # Two cargo-llvm-cov invocations are used intentionally:
  #   1. Generate the LCOV report for artifact upload.
  #   2. Re-run with --fail-under-lines to enforce the threshold as a hard
  #      gate. A single invocation with both flags is not supported by all
  #      versions of cargo-llvm-cov, so two passes keep this explicit.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage (macOS)
    runs-on: macos-latest
    needs: check
    # Job-level cap. Without this, a hung instrumented test (we hit one in
    # PR #20: 6h5m) burns billable CI minutes. 30 min is ~6x historical
    # green-run wall time; genuine slowdowns still pass.
    timeout-minutes: 30
    # Coverage is a hard merge gate: the suite sits at the ~90% honest
    # ceiling (measured 90.26% lines), so a regression below the floor must
    # block merge rather than be silently tolerated.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # taiki-e/install-action provides a fast, pre-built install of
      # cargo-llvm-cov without a full `cargo install` compile step.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Install cargo-insta to run the snapshot check step below.
      - name: Install cargo-insta
        uses: taiki-e/install-action@cargo-insta

      # Verify that every insta snapshot has been reviewed (i.e. committed).
      # --check causes `cargo insta test` to fail if any snapshot is pending
      # review, preventing unreviewed snapshots from landing in main.
      - name: Check insta snapshots are reviewed
        run: cargo insta test --workspace --check

      # Generate the LCOV report. --all-features ensures every code path
      # gated behind a feature flag is included in the measurement.
      # Step-level timeout: hangs fail in 20 min, not 6h.
      - name: Generate LCOV coverage report
        timeout-minutes: 20
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      # Hard gate: fail the job if line coverage is below 88%.
      # 88% is a deliberate floor below the measured 90.26% workspace line
      # coverage (the honest ceiling), leaving ~2pt margin for instrumentation
      # noise. The remaining gap is the dashboard event loop (event.rs, mod.rs)
      # and complex UI render code (settings/render.rs), inherently untestable
      # in CI (terminal I/O, crossterm events).
      - name: Enforce 88% line coverage threshold
        timeout-minutes: 5
        run: cargo llvm-cov --all-features --workspace --fail-under-lines 88

      # Upload lcov.info so it can be inspected in the Actions UI or fed
      # to a coverage viewer without re-running the full build.
      - name: Upload LCOV report artifact
        uses: actions/upload-artifact@v7
        with:
          name: lcov-report
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # audit: check dependencies for known vulnerabilities and policy violations
  # Runs on ubuntu only — advisory database is platform-neutral.
  # Gates: cargo-audit (RustSec advisories), cargo-deny (policy/licenses/sources)
  # ---------------------------------------------------------------------------
  audit:
    name: Supply-chain (cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Single curated supply-chain gate — advisories + bans + licenses + sources,
      # all governed by deny.toml (yanked = deny, vulnerabilities/unsound denied,
      # triaged unmaintained crates enumerated under [advisories].ignore).
      #
      # This replaces the previous standalone `cargo audit` step: `cargo audit`
      # does not read deny.toml, so it was an unconfigured duplicate of the same
      # RustSec advisory check with divergent severity handling — pure noise, not
      # a stronger second opinion. `cargo-deny` covers the same vulnerability
      # surface plus policy checks. Using the official pre-built, pinned action
      # also drops the slow `cargo install cargo-deny` compile.
      #
      # Advisories stay a per-PR blocking gate (a real vulnerability must not
      # merge). A scheduled daily drift check lives in advisories.yml so newly
      # published upstream advisories surface for triage between PRs too.
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # The action defaults to an older Rust; pin to the workspace MSRV so
          # it can read the edition-2024 / lockfile-v4 workspace metadata.
          rust-version: "1.85"
